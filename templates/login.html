<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SQL Injection Lab</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #1d2671, #c33764);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        background: white;
        padding: 30px;
        border-radius: 15px;
        width: 320px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        text-align: center;
    }

    h2 {
        margin-bottom: 20px;
        color: #333;
    }

    input {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 8px;
        outline: none;
    }

    input:focus {
        border-color: #c33764;
    }

    button {
        width: 95%;
        padding: 10px;
        background: linear-gradient(135deg, #1d2671, #c33764);
        border: none;
        color: white;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        opacity: 0.9;
    }

    .message {
        margin-top: 15px;
        font-weight: bold;
    }

    .success {
        color: green;
    }

    .error {
        color: red;
    }

    .footer {
        margin-top: 15px;
        font-size: 12px;
        color: gray;
    }
</style>


</head>

<body>

<div class="container">
    <h2>🔐 SQL Injection Lab</h2>


<form method="POST">
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Login</button>
</form>

{% if message %}
    <div class="message {{ 'success' if 'Welcome' in message else 'error' }}">
        {{ message }}
    </div>
{% endif %}

<div class="footer">
    Practice SQL Injection safely 🚨
</div>


</div>

</body>
</html>
